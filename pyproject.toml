[project]
name = "matcom-gym"
version = "0.1.0"
description = "Coding gym for MatCom students — CLI-first, test-driven feedback."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MatCom", email = "matcom@uh.cu"}]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
matcom-gym = "matcom_gym.cli:app"

[project.urls]
Homepage = "https://github.com/matcom/gym"
Issues = "https://github.com/matcom/gym/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcom_gym"]

[tool.hatch.build.targets.wheel.force-include]
"src/matcom_gym/content" = "matcom_gym/content"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
